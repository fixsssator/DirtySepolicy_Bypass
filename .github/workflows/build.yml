name: Build experimental module

on:
  push:
    branches:
      - bakasu-zygisk-next
  pull_request:
    branches:
      - bakasu-zygisk-next
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"

      - name: Build arm64 module
        run: |
          set -eux
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          mkdir -p module/zygisk
          "$NDK/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            APP_ABI=arm64-v8a \
            APP_PLATFORM=android-23 \
            NDK_OUT=/tmp/ndk-out \
            NDK_LIBS_OUT=/tmp/ndk-libs
          install -m 0644 /tmp/ndk-libs/arm64-v8a/libdirtysepbypass.so module/zygisk/arm64-v8a.so
          rm -f dirtysepbypass-bakasu-zygisk-next.zip
          (
            cd module
            zip -r9 ../dirtysepbypass-bakasu-zygisk-next.zip module.prop customize.sh META-INF zygisk
          )
          unzip -Z1 dirtysepbypass-bakasu-zygisk-next.zip | grep -Fxq 'module.prop'
          unzip -Z1 dirtysepbypass-bakasu-zygisk-next.zip | grep -Fxq 'customize.sh'
          unzip -Z1 dirtysepbypass-bakasu-zygisk-next.zip | grep -Fxq 'zygisk/arm64-v8a.so'
          if unzip -Z1 dirtysepbypass-bakasu-zygisk-next.zip | grep -q '^module/'; then
            echo "ERROR: ZIP entries must not be nested under module/"
            exit 1
          fi

      - name: Publish direct ZIP download
        if: github.event_name == 'push' && github.ref == 'refs/heads/bakasu-zygisk-next'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: experimental-bakasu-zygisk-next-${{ github.run_number }}
          name: Experimental BakaSU / Zygisk Next build ${{ github.run_number }}
          prerelease: true
          files: dirtysepbypass-bakasu-zygisk-next.zip
          generate_release_notes: false
